name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Run Tests
        run: |
          go test -v -race ./...

      - name: Build Binaries
        run: |
          go build -v ./cmd/cli
          go build -v ./cmd/server
          go build -v ./cmd/thread
