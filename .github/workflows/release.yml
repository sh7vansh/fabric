name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build Canonical Binaries
        run: |
          mkdir -p dist
          
          # Build canonical binaries across supported Linux architectures
          ARCHS=("amd64" "arm64" "arm")
          TAG_VERSION="${{ github.ref_name }}"
          COMMIT_SHA="${{ github.sha }}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          PROTOCOL_VERSION="1.0.0"
          
          LDFLAGS="-s -w -X fabric/internal/version.Version=${TAG_VERSION} -X fabric/internal/version.GitCommit=${COMMIT_SHA} -X fabric/internal/version.BuildDate=${BUILD_DATE} -X fabric/internal/version.ProtocolVersion=${PROTOCOL_VERSION}"
          
          for ARCH in "${ARCHS[@]}"; do
            echo "Building canonical binaries for linux/$ARCH..."
            GOOS=linux GOARCH=$ARCH go build -ldflags="${LDFLAGS}" -o "dist/fabric-linux-$ARCH" ./cmd/cli
            GOOS=linux GOARCH=$ARCH go build -ldflags="${LDFLAGS}" -o "dist/fabric-server-linux-$ARCH" ./cmd/server
            GOOS=linux GOARCH=$ARCH go build -ldflags="${LDFLAGS}" -o "dist/fabric-thread-linux-$ARCH" ./cmd/thread
          done

      - name: Generate Checksum Manifest
        run: |
          cd dist
          sha256sum fabric* > checksums.txt
          cat checksums.txt

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
